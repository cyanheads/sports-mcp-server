# Bunfig: Centralized configuration for Bun behavior
# For more options, see: https://bun.com/docs/runtime/bunfig

[install]
auto = "fallback"
frozenLockfile = false
# Block package versions published less than 3 days ago — supply-chain guard
# against freshly compromised releases. Bun widens the window automatically
# when it detects rapid-fire publishes just past the gate. Existing versions
# in bun.lock are unaffected.
minimumReleaseAge = 259200 # seconds (3 days)

[install.security]
# Socket scans every package before install (malware, typosquats, CVEs).
# Note: configuring a scanner disables Bun's auto-install.
scanner = "@socketsecurity/bun-security-scanner"

[run]
bun = true
